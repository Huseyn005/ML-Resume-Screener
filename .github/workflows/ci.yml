name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest
        working-directory: backend

  docker:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: shortlist-backend:test
          build-args: |
            TORCH_VERSION=2.9.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run -d --name shortlist-backend -p 8000:8000 shortlist-backend:test
      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 300); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs shortlist-backend
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf==1.28.2
      - run: python backend/tools/smoke_test.py --url http://127.0.0.1:8000
      - if: always()
        run: docker rm --force shortlist-backend

  deploy:
    needs: [changes, backend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.backend == 'true' && vars.DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-master
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy backend over SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: DEPLOY_PATH,COMPOSE_SERVICE
          script_stop: true
          command_timeout: 30m
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            COMPOSE_SERVICE="${COMPOSE_SERVICE:-backend}"
            if [ "$COMPOSE_SERVICE" = "caddy" ]; then
              echo "Refusing to deploy the Caddy service." >&2
              exit 1
            fi

            PREVIOUS_ID=""
            IMAGE_REF=""
            CONTAINER_ID="$(docker compose ps --all -q "$COMPOSE_SERVICE")"
            if [ -n "$CONTAINER_ID" ]; then
              PREVIOUS_ID="$(docker inspect --format '{{.Image}}' "$CONTAINER_ID")"
              IMAGE_REF="$(docker inspect --format '{{.Config.Image}}' "$CONTAINER_ID")"
              IMAGE_REPO="${IMAGE_REF%@*}"
              IMAGE_LEAF="${IMAGE_REPO##*/}"
              case "$IMAGE_LEAF" in
                *:*) IMAGE_REPO="${IMAGE_REPO%:*}" ;;
              esac
              docker image tag "$PREVIOUS_ID" "${IMAGE_REPO}:previous"
            fi

            rollback() {
              docker compose logs --tail 100 "$COMPOSE_SERVICE" || true
              if [ -n "$PREVIOUS_ID" ]; then
                if docker image tag "$PREVIOUS_ID" "$IMAGE_REF"; then
                  docker compose up -d --no-deps --no-build "$COMPOSE_SERVICE" || true
                else
                  echo "Could not retag the previous backend image." >&2
                fi
              else
                echo "No previous backend image exists; stopping the failed deployment." >&2
                docker compose stop "$COMPOSE_SERVICE" || true
              fi
            }

            if ! git pull --ff-only origin master; then
              rollback
              exit 1
            fi
            if ! docker compose build "$COMPOSE_SERVICE"; then
              rollback
              exit 1
            fi
            if ! docker compose up -d --no-deps "$COMPOSE_SERVICE"; then
              rollback
              exit 1
            fi

            HEALTHY=false
            for attempt in $(seq 1 300); do
              CONTAINER_ID="$(docker compose ps --all -q "$COMPOSE_SERVICE")"
              if [ -n "$CONTAINER_ID" ]; then
                HEALTH="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER_ID")"
                if [ "$HEALTH" = "healthy" ]; then
                  HEALTHY=true
                  break
                fi
              fi
              sleep 1
            done
            if [ "$HEALTHY" != "true" ]; then
              rollback
              exit 1
            fi

            docker image prune -f
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          COMPOSE_SERVICE: ${{ vars.COMPOSE_SERVICE }}
      - uses: actions/setup-python@v5
        if: vars.API_URL != ''
        with:
          python-version: "3.12"
      - name: Install smoke-test dependency
        if: vars.API_URL != ''
        run: python -m pip install pymupdf==1.28.2
      - name: Smoke-test deployed API
        if: vars.API_URL != ''
        env:
          API_URL: ${{ vars.API_URL }}
        run: python backend/tools/smoke_test.py --url "$API_URL"
      - name: Roll back after failed smoke test
        if: failure() && vars.API_URL != '' && steps.deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: DEPLOY_PATH,COMPOSE_SERVICE
          script_stop: true
          command_timeout: 30m
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            COMPOSE_SERVICE="${COMPOSE_SERVICE:-backend}"
            if [ "$COMPOSE_SERVICE" = "caddy" ]; then
              echo "Refusing to roll back the Caddy service." >&2
              exit 1
            fi
            docker compose logs --tail 100 "$COMPOSE_SERVICE" || true
            CONTAINER_ID="$(docker compose ps --all -q "$COMPOSE_SERVICE")"
            if [ -z "$CONTAINER_ID" ]; then
              echo "No backend container is available for rollback." >&2
              exit 1
            fi
            IMAGE_REF="$(docker inspect --format '{{.Config.Image}}' "$CONTAINER_ID")"
            IMAGE_REPO="${IMAGE_REF%@*}"
            IMAGE_LEAF="${IMAGE_REPO##*/}"
            case "$IMAGE_LEAF" in
              *:*) IMAGE_REPO="${IMAGE_REPO%:*}" ;;
            esac
            PREVIOUS_TAG="${IMAGE_REPO}:previous"
            if ! docker image inspect "$PREVIOUS_TAG" >/dev/null 2>&1; then
              echo "No previous backend image exists; stopping the failed deployment." >&2
              docker compose stop "$COMPOSE_SERVICE"
              exit 1
            fi
            docker image tag "$PREVIOUS_TAG" "$IMAGE_REF"
            docker compose up -d --no-deps --no-build "$COMPOSE_SERVICE"
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          COMPOSE_SERVICE: ${{ vars.COMPOSE_SERVICE }}
